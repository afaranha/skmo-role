---
# Example inventory for multi-server CRC deployment
crc_servers:
  hosts:
    afariasa-region-1:
      ansible_host: 10.0.203.216
      ansible_user: fedora
      region_name: region-1
      # OpenStack namespace configuration
      openstack_namespace: "openstack-region-1"
      openstack_operators_namespace: "openstack-operators"  # Shared operators namespace
      network_isolation: true
      # Network ranges for install_yamls network isolation
      network_ranges:
        - "172.17.0"  # Internal API
        - "172.18.0"  # Storage
        - "172.19.0"  # Tenant
        - "172.20.0"  # Storage Management
      ctlplane_interface: enp1s0
      
    afariasa-region-2:
      ansible_host: 10.0.203.236
      ansible_user: fedora
      region_name: region-2
      # OpenStack namespace configuration  
      openstack_namespace: "openstack-region-2"
      openstack_operators_namespace: "openstack-operators"  # Shared operators namespace
      network_isolation: true
      # Network ranges for install_yamls network isolation (different from region-1)
      network_ranges:
        - "172.27.0"  # Internal API
        - "172.28.0"  # Storage
        - "172.29.0"  # Tenant
        - "172.30.0"  # Storage Management
      ctlplane_interface: enp1s0

  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_become: yes
    ansible_become_method: sudo
