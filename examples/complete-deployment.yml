---
- name: Complete CRC + OpenStack + SKMO Deployment
  hosts: crc_servers
  gather_facts: true
  become: yes
  
  vars:
    # CRC Configuration
    crc_version: "2.43.0"
    crc_user: "fedora"
    crc_memory: "25600"
    crc_cpus: "12"
    crc_disk_size: "100"
    crc_deploy_openstack: true
    crc_operator_namespace: "openstack-operators"
    crc_workload_namespace: "{{ server_namespace }}"
    crc_network_isolation: true
    crc_network_ranges: "{{ network_ranges }}"
    
    # SKMO Configuration
    skmo_namespaces:
      - name: "{{ server_namespace }}"
        region: "{{ region_name }}"
        is_region_zero: "{{ inventory_hostname == groups['crc_servers'][0] }}"
        server_host: "{{ ansible_host }}"
        cluster_context: "default/api-crc-testing:6443/kubeadmin"

  tasks:
    - name: Phase 1 - Deploy CRC Infrastructure
      include_role:
        name: crc
      tags: [infrastructure, crc]

    - name: Wait for all servers to complete CRC deployment
      wait_for:
        timeout: 30
      delegate_to: localhost
      run_once: true
      tags: [infrastructure]

    - name: Phase 2 - Setup SKMO Multi-Region Networking
      include_role:
        name: skmo
      tags: [networking, skmo]

  post_tasks:
    - name: Generate deployment summary
      set_fact:
        deployment_summary:
          server: "{{ inventory_hostname }}"
          region: "{{ region_name }}"
          namespace: "{{ server_namespace }}"
          crc_console: "https://console-openshift-console.apps-crc.testing"
          access_scripts:
            - "/home/{{ crc_user }}/crc-access.sh"
            - "/home/{{ crc_user }}/openstack-access.sh"
            - "/home/{{ crc_user }}/manage-crc.sh"

    - name: Display final deployment status
      debug:
        msg: |
          🎉 COMPLETE DEPLOYMENT FINISHED!
          ================================
          
          Server: {{ deployment_summary.server }}
          Region: {{ deployment_summary.region }}
          Namespace: {{ deployment_summary.namespace }}
          Console: {{ deployment_summary.crc_console }}
          
          📁 Access Scripts:
          {% for script in deployment_summary.access_scripts %}
          - {{ script }}
          {% endfor %}
          
          🌐 Multi-region networking configured via SKMO
          ✅ Ready for production workloads!
          
          Next Steps:
          1. SSH to {{ ansible_host }} as {{ crc_user }}
          2. Run ./crc-access.sh to verify cluster
          3. Run ./openstack-access.sh to access OpenStack
          4. Test inter-region connectivity