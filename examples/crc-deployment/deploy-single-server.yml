---
- name: Deploy CRC on Single Server
  hosts: crc_server
  gather_facts: true
  become: yes
  
  vars:
    crc_version: "2.43.0"
    crc_user: "fedora"
    crc_memory: "16384"  # 16GB for single server
    crc_cpus: "8"
    crc_disk_size: "80"
    crc_deploy_openstack: true
    crc_operator_namespace: "openstack-operators"
    crc_workload_namespace: "openstack"
  
  roles:
    - role: crc

  post_tasks:
    - name: Display access information
      debug:
        msg: |
          ✅ Single server CRC deployment complete!
          
          Access your deployment:
          ssh {{ crc_user }}@{{ ansible_host }}
          ./crc-access.sh