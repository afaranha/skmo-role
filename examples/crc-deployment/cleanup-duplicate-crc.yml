---
- name: Cleanup duplicate CRC installations
  hosts: all
  become: false
  gather_facts: true
  vars:
    crc_user: fedora

  tasks:
    - name: Include CRC cleanup tasks
      include_tasks: ../../crc/tasks/cleanup_duplicate_crc.yml
      tags: always

    - name: Final summary
      debug:
        msg: |
          🎉 CRC Cleanup Complete!
          
          Summary for {{ inventory_hostname }}:
          - Removed duplicate manual CRC installation
          - Ensured install_yamls CRC is primary
          - Updated PATH configuration
          
          Next: Use install_yamls methodology:
          1. cd ~/openstack/install_yamls/devsetup
          2. export PULL_SECRET=~/pull-secret.txt
          3. make crc