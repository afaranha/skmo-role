---
- name: Deploy CRC with Advanced OpenStack (Enterprise-Grade)
  hosts: crc_servers
  gather_facts: true
  become: yes
  
  vars:
    # Global CRC configuration
    crc_version: "2.43.0"
    crc_user: "fedora"
    crc_memory: "25600"
    crc_cpus: "12"
    crc_disk_size: "100"
    crc_deploy_openstack: true
    
    # OpenStack Advanced Configuration
    crc_use_advanced_deployment: true  # Enable enterprise-grade deployment
    crc_operator_namespace: "openstack-operators"  # Default namespace (shared)
    crc_openstack_password: "openstack123"
    crc_openstack_timeout: "900s"  # Extended timeout for advanced deployment
    crc_openstack_release: "antelope"
    crc_storage_class: "local-storage"
    
    # Server-specific configurations using host variables
    crc_workload_namespace: "{{ server_namespace | default('openstack') }}"
    crc_network_isolation: "{{ network_isolation | default(true) }}"
    crc_network_ranges: "{{ network_ranges | default([]) }}"
    crc_ctlplane_interface: "{{ ctlplane_interface | default('enp1s0') }}"
  
  roles:
    - role: crc
      tags: [crc, openstack, advanced]

  post_tasks:
    - name: Display advanced deployment summary
      debug:
        msg: |
          🎉 Advanced OpenStack deployment completed!
          
          📍 **Server:** {{ inventory_hostname }}
          🏷️  **Region:** {{ region_name | default('default') }}
          📁 **Namespace:** {{ crc_workload_namespace }}
          🔧 **Operators:** {{ crc_operator_namespace }} (shared)
          🌐 **Network Isolation:** {{ 'Enabled' if crc_network_isolation else 'Disabled' }}
          
          {% if crc_network_ranges | length > 0 %}
          🔗 **Network Ranges:**
          - Internal API: {{ crc_network_ranges[0] }}.x
          - Storage: {{ crc_network_ranges[1] }}.x
          - Tenant: {{ crc_network_ranges[2] }}.x
          - Storage Mgmt: {{ crc_network_ranges[3] }}.x
          {% endif %}
          
          📁 **Management Files Generated:**
          - Advanced Monitor: `./monitor-advanced-{{ inventory_hostname }}.sh`
          - Deployment Report: `./advanced-deployment-{{ inventory_hostname }}.md`
          - Basic Monitor: `./monitor-openstack-{{ inventory_hostname }}.sh`
          - Configuration: `./openstack-config-{{ inventory_hostname }}.md`
          
          🔧 **Access Commands:**
          ```bash
          ssh {{ crc_user }}@{{ ansible_host }}
          ./monitor-advanced-{{ inventory_hostname }}.sh     # Comprehensive monitoring
          ./openstack-access.sh                              # Quick access script
          ```
          
          📖 **Continue Deployment:**
          ```bash
          cd /home/{{ crc_user }}/openstack/install_yamls
          export NAMESPACE={{ crc_workload_namespace }}
          export OPERATOR_NAMESPACE={{ crc_operator_namespace }}
          make openstack_wait_deploy
          ```
          
          ⚡ **Enterprise Features Enabled:**
          - Enhanced operator validation
          - Comprehensive monitoring scripts
          - Detailed deployment documentation
          - Advanced error handling and recovery
          - Network isolation with proper prefixes
          - Multi-phase deployment with validation

    - name: Generate cluster access summary
      copy:
        content: |
          # Advanced OpenStack Cluster Access Summary
          
          Generated: {{ ansible_date_time.iso8601 }}
          
          ## Deployed Clusters
          
          {% for host in groups['crc_servers'] %}
          ### {{ host }}
          - **IP:** {{ hostvars[host]['ansible_host'] }}
          - **Region:** {{ hostvars[host]['region_name'] | default('default') }}
          - **Namespace:** {{ hostvars[host]['server_namespace'] | default('openstack') }}
          - **Role:** {{ 'Region Zero (Identity)' if loop.first else 'Workload Region' }}
          
          **Access:**
          ```bash
          ssh fedora@{{ hostvars[host]['ansible_host'] }}
          ./monitor-advanced-{{ host }}.sh
          ```
          
          **Network Configuration:**
          {% if hostvars[host]['network_ranges'] is defined %}
          {% for range in hostvars[host]['network_ranges'] %}
          - {{ ['Internal API', 'Storage', 'Tenant', 'Storage Mgmt'][loop.index0] }}: {{ range }}.x
          {% endfor %}
          {% else %}
          - Default networking
          {% endif %}
          
          {% endfor %}
          
          ## Global Commands
          
          ### Monitor All Regions
          ```bash
          {% for host in groups['crc_servers'] %}
          ssh fedora@{{ hostvars[host]['ansible_host'] }} './monitor-advanced-{{ host }}.sh'
          {% endfor %}
          ```
          
          ### Access OpenStack CLI (Region Zero)
          ```bash
          ssh fedora@{{ hostvars[groups['crc_servers'][0]]['ansible_host'] }}
          cd /home/fedora/openstack/install_yamls
          export NAMESPACE={{ hostvars[groups['crc_servers'][0]]['server_namespace'] }}
          make openstack_wait_deploy
          oc rsh -n $NAMESPACE openstackclient
          ```
          
          ## SKMO Multi-Region Setup
          
          After OpenStack deployment completes, configure SKMO networking:
          
          ```bash
          cd {{ ansible_env.PWD if ansible_env is defined else '.' }}
          ansible-playbook ../complete-deployment.yml
          ```
          
          ## Troubleshooting
          
          ### Check Deployment Status
          ```bash
          {% for host in groups['crc_servers'] %}
          # {{ host }}
          ssh fedora@{{ hostvars[host]['ansible_host'] }} 'oc get openstackcontrolplane -n {{ hostvars[host]['server_namespace'] }}'
          {% endfor %}
          ```
          
          ### Common Issues
          1. **Operators not ready:** Wait 15-20 minutes for operator installation
          2. **Pods not starting:** Check storage class and PVs availability
          3. **Network issues:** Verify network isolation configuration
          4. **Access issues:** Ensure CRC is running and oc login is successful
          
          ---
          *Advanced OpenStack deployment with enterprise-grade monitoring and validation*
        dest: "./advanced-openstack-cluster-summary.md"
        mode: '0644'
      delegate_to: localhost
      run_once: true

    - name: Final deployment notification
      debug:
        msg: |
          🚀 **ADVANCED OPENSTACK DEPLOYMENT COMPLETE!**
          
          📊 **Deployment Type:** Enterprise-Grade with Enhanced Monitoring
          📁 **Cluster Summary:** ./advanced-openstack-cluster-summary.md
          ⏱️  **Estimated Completion:** 60-90 minutes total
          
          🔧 **Next Steps:**
          1. Monitor deployments: Check individual server monitoring scripts
          2. Wait for completion: Use `make openstack_wait_deploy` on each server
          3. Access OpenStack: Use generated access scripts
          4. Configure SKMO: Run complete deployment for multi-region networking
          
          💡 **Pro Tip:** Use the advanced monitoring scripts for comprehensive status checking!
      run_once: true