---
- name: Deploy CRC using proper install_yamls methodology
  hosts: all
  become: false
  gather_facts: true
  vars:
    # Use install_yamls proper setup approach
    crc_use_install_yamls_setup: true
    crc_user: fedora
    
    # Per-server OpenStack namespace configuration
    crc_openstack_namespace: "{{ inventory_hostname }}-openstack"
    
    # Server-specific variables
    crc_region_name: "{{ inventory_hostname }}"

  tasks:
    - name: Display deployment plan
      debug:
        msg: |
          🚀 CRC Deployment Plan using proper install_yamls methodology
          ===============================================================
          
          Target: {{ inventory_hostname }} ({{ ansible_default_ipv4.address | default('IP not available') }})
          
          📋 Workflow:
          1. 🧹 Clean up any conflicting CRC installations
          2. 📥 Clone install_yamls repository
          3. 🔧 Download dependencies using install_yamls download_tools
          4. 🏗️  Install CRC using install_yamls crc-setup.sh script
          5. ⚙️  Configure and start CRC cluster
          6. 🎯 Ready for OpenStack deployment
          
          Configuration:
          - Namespace: {{ crc_openstack_namespace }}
          - Region: {{ crc_region_name }}
          - Memory: {{ crc_memory | default('25600') }}MB
          - CPUs: {{ crc_cpus | default('12') }}
          - Disk: {{ crc_disk_size | default('100') }}GB
          
          Following install_yamls README exactly! 📚

    - name: Include CRC role with proper install_yamls setup
      include_role:
        name: crc
      vars:
        # Force use of proper install_yamls methodology
        crc_use_install_yamls_setup: true
        
        # Set namespace for this deployment
        crc_workload_namespace: "{{ crc_openstack_namespace }}"
        
        # Use install_yamls specific settings
        crc_kubeadmin_password: "{{ crc_install_yamls_kubeadmin_pwd | default('12345678') }}"

    - name: Final deployment summary
      debug:
        msg: |
          ✅ CRC Deployment Complete for {{ inventory_hostname }}!
          
          🎯 Environment Ready:
          - CRC installed using install_yamls methodology
          - Dependencies downloaded via install_yamls download_tools
          - Environment script: ~/setup-install-yamls-env.sh
          - Working directory: ~/openstack/install_yamls
          
          🚀 Next Steps (following install_yamls README):
          ```bash
          # Connect to server
          ssh {{ crc_user }}@{{ ansible_default_ipv4.address }}
          
          # Source environment
          source ~/setup-install-yamls-env.sh
          
          # Follow install_yamls workflow
          cd ~/openstack/install_yamls
          make crc_storage      # Configure persistent storage
          make input            # Create input secrets
          make openstack        # Install OpenStack operators
          make openstack_deploy # Deploy OpenStack control plane
          ```
          
          📊 Monitor Progress:
          - Console: crc console --url
          - Status: install_yamls_status
          - Logs: oc logs -n {{ crc_openstack_namespace }}
          
          🌐 Ready for OpenStack {{ crc_region_name }} deployment!