---
- name: Deploy CRC and OpenStack on Multiple Servers
  hosts: crc_servers
  gather_facts: true
  become: yes
  
  vars:
    # Global CRC configuration
    crc_version: "2.43.0"
    crc_user: "fedora"
    crc_memory: "25600"
    crc_cpus: "12"
    crc_disk_size: "100"
    crc_deploy_openstack: true
    crc_operator_namespace: "openstack-operators"
    
    # Server-specific configurations using host variables
    crc_workload_namespace: "{{ server_namespace | default('openstack') }}"
    crc_network_isolation: "{{ network_isolation | default(true) }}"
    crc_network_ranges: "{{ network_ranges | default([]) }}"
    crc_ctlplane_interface: "{{ ctlplane_interface | default('enp1s0') }}"
  
  roles:
    - role: crc
      tags: [crc, openstack]

  post_tasks:
    - name: Display deployment summary
      debug:
        msg: |
          🎉 CRC + OpenStack deployment completed!
          
          Server: {{ inventory_hostname }}
          Region: {{ region_name | default('default') }}
          Namespace: {{ crc_workload_namespace }}
          Network Ranges: {{ crc_network_ranges | join(', ') if crc_network_ranges else 'Default' }}
          
          Access Commands:
          ssh {{ crc_user }}@{{ ansible_host }}
          ./crc-access.sh
          ./openstack-access.sh