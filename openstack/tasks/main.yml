- name: Step 1 - Install OpenStack operators
  shell: |
    cd {{ install_yamls_path }}
    eval "$(crc oc-env)"
    make openstack
  become_user: "{{ ansible_user }}"
  register: make_openstack_result
  tags: openstack_operators

- name: Display Create input secrets results
  debug:
    msg: "{{ make_openstack_result.stdout }}"
  tags: openstack_operators

- name: Step 2 - Initialize OpenStack
  shell: |
    cd {{ install_yamls_path }}
    eval "$(crc oc-env)"
    make openstack_init
  become_user: "{{ ansible_user }}"
  register: make_openstack_init_result
  tags: openstack_init

- name: Display Initialize OpenStack results
  debug:
    msg: "{{ make_openstack_init_result.stdout }}"
  tags: openstack_init

- name: Step 3 - Deploy OpenStack control plane
  shell: |
    cd {{ install_yamls_path }}
    eval "$(crc oc-env)"
    NAMESPACE="{{ openstack_namespace }}" make openstack_deploy
  become_user: "{{ ansible_user }}"
  register: openstack_deploy_result
  tags: openstack_deploy

- name: Display Deploy OpenStack control plane results
  debug:
    msg: "{{ openstack_deploy_result.stdout }}"
  tags: openstack_deploy
