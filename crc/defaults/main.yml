---
# CRC Role Default Variables

# CRC Installation Configuration
crc_version: "2.43.0"
crc_download_url: "https://developers.redhat.com/content-gateway/rest/mirror/pub/openshift-v4/clients/crc"
crc_install_dir: "/home/{{ crc_user }}/crc"
crc_user: "fedora"

# CRC Resource Configuration
crc_memory: "25600"  # MB
crc_cpus: "12"
crc_disk_size: "100"  # GB
crc_enable_cluster_monitoring: false
crc_kubeadmin_password: "password"

# CRC Network Configuration
crc_base_domain: "testing"
crc_nameserver: "1.1.1.1"

# OpenStack Configuration (when deploying OpenStack)
crc_deploy_openstack: true
crc_openstack_repo: "https://github.com/openstack-k8s-operators/install_yamls.git"
crc_openstack_dir: "/home/{{ crc_user }}/openstack"
crc_operator_namespace: "openstack-operators"  # Default namespace for operators (both regions)
crc_workload_namespace: ""  # Set per server (e.g., afariasa-region-1-openstack)

# Install_yamls specific configuration
crc_install_yamls_repo: "https://github.com/openstack-k8s-operators/install_yamls.git"
crc_install_yamls_crc_url: "https://developers.redhat.com/content-gateway/rest/mirror/pub/openshift-v4/clients/crc/latest/crc-linux-amd64.tar.xz"
crc_install_yamls_kubeadmin_pwd: "12345678"  # Default kubeadmin password for install_yamls

# OpenStack Deployment Configuration
crc_openstack_password: "openstack123"
crc_openstack_timeout: "600s"
crc_network_isolation: true

# Network Ranges Configuration (per region)
crc_network_ranges: []
# Example per region:
# Region 1: ["172.17.0", "172.18.0", "172.19.0", "172.20.0"]
# Region 2: ["172.27.0", "172.28.0", "172.29.0", "172.30.0"]

# Install_yamls Make Targets
crc_install_yamls_targets:
  - crc_storage
  - input
  - openstack
  - openstack_init  
  - openstack_deploy

# Advanced deployment options
crc_use_advanced_deployment: false  # Set to true for enterprise-grade deployment with enhanced monitoring
crc_openstack_release: "antelope"   # OpenStack release version
crc_storage_class: "local-storage"  # Storage class for OpenStack

# Multi-server configuration
crc_servers: []
# Example:
# crc_servers:
#   - name: "region-1"
#     host: "10.0.79.173"
#     user: "fedora"
#     namespace: "region-1-openstack"
#     region_name: "region-1"
#     network_ranges:
#       - "172.17.0.0/16"
#       - "172.18.0.0/16"
#   - name: "region-2"
#     host: "10.0.79.110"
#     user: "fedora"
#     namespace: "region-2-openstack"
#     region_name: "region-2"
#     network_ranges:
#       - "172.27.0.0/16"
#       - "172.28.0.0/16"

# System packages required
crc_required_packages:
  - wget
  - curl
  - git
  - make
  - podman
  - tar
  - gzip
  - NetworkManager
  - unzip

# Deployment timeouts (seconds)
crc_setup_timeout: 1800    # 30 minutes
crc_start_timeout: 1800    # 30 minutes
# Note: crc_openstack_timeout is defined above in OpenStack section

# Feature flags
crc_create_access_scripts: true
crc_setup_sudoers: true
crc_configure_firewall: true
crc_validate_deployment: true
crc_use_install_yamls_setup: true  # Use install_yamls 'make crc' instead of direct CRC commands

# Advanced Configuration  
crc_pull_secret_path: "/root/ai-workspace/pull-secret.txt"  # Path to pull secret file in ai-workspace
crc_pull_secret_dest: "/home/{{ crc_user }}/pull-secret.txt"  # Destination on target servers
crc_skip_if_running: true  # Skip CRC setup/start if already running
crc_additional_config: {}
# Example:
# crc_additional_config:
#   network-mode: "user"
#   host-network-access: true

# Logging
crc_log_level: "info"  # debug, info, warn, error