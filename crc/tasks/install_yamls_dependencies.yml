---
# Install install_yamls dependencies manually 
# Based on roles/download_tools/tasks/main.yaml and defaults/main.yaml

- name: Create ~/bin directory
  file:
    path: "/home/{{ crc_user }}/bin"
    state: directory
    mode: '0755'
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
  tags: create_bin_dir

- name: Install build dependencies via dnf
  become: true
  shell: |
    dnf install -y jq skopeo sqlite httpd-tools virt-install gcc python3-jinja2 xmlstarlet openssl
  ignore_errors: true
  tags: build_deps

- name: Download kubectl
  get_url:
    url: "https://dl.k8s.io/release/v1.25.7/bin/linux/amd64/kubectl"
    dest: "/home/{{ crc_user }}/bin/kubectl"
    mode: '0755'
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
  become_user: "{{ crc_user }}"
  tags: kubectl

- name: Download opm (latest)
  get_url:
    url: "https://github.com/operator-framework/operator-registry/releases/latest/download/linux-amd64-opm"
    dest: "/home/{{ crc_user }}/bin/opm"
    mode: '0755'
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
  become_user: "{{ crc_user }}"
  tags: opm

- name: Download operator-sdk
  get_url:
    url: "https://github.com/operator-framework/operator-sdk/releases/download/v1.31.0/operator-sdk_linux_amd64"
    dest: "/home/{{ crc_user }}/bin/operator-sdk"
    mode: '0755'
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
  become_user: "{{ crc_user }}"
  tags: operator_sdk

- name: Download kustomize
  unarchive:
    src: "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.0.3/kustomize_v5.0.3_linux_amd64.tar.gz"
    dest: "/home/{{ crc_user }}/bin/"
    remote_src: true
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
    mode: '0755'
  become_user: "{{ crc_user }}"
  tags: kustomize

- name: Download golang 1.21.13
  unarchive:
    src: "https://go.dev/dl/go1.21.13.linux-amd64.tar.gz"
    dest: "/usr/local"
    remote_src: true
    creates: "/usr/local/go/bin/go"
  become: true
  tags: golang

- name: Create go symlinks
  file:
    src: "/usr/local/go/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  become: true
  loop:
    - go
    - gofmt
  tags: golang

- name: Verify installed tools
  shell: |
    export PATH="/home/{{ crc_user }}/bin:$PATH"
    echo "=== Installed Tools ==="
    which kubectl && kubectl version --client=true --short=true || echo "kubectl: not found"
    which opm && opm version || echo "opm: not found"  
    which operator-sdk && operator-sdk version || echo "operator-sdk: not found"
    which kustomize && kustomize version || echo "kustomize: not found"
    which go && go version || echo "go: not found"
    echo "Done."
  become_user: "{{ crc_user }}"
  register: tools_verification
  tags: verify

- name: Display tools verification
  debug:
    msg: |
      📦 Install_yamls Dependencies Installation Complete!
      
      {{ tools_verification.stdout }}
      
      ✅ All essential tools for install_yamls are now available
      📁 Tools installed in: /home/{{ crc_user }}/bin/
  tags: verify