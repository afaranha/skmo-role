---
# Check if CRC is already installed and running

- name: Check if CRC binary exists
  stat:
    path: "{{ crc_install_dir }}/crc"
  register: crc_binary_exists

- name: Check CRC status if binary exists
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    {{ crc_install_dir }}/crc status
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: crc_current_status
  failed_when: false
  changed_when: false
  when: crc_binary_exists.stat.exists

- name: Parse CRC status
  set_fact:
    crc_is_running: "{{ crc_current_status.stdout is defined and 'Running' in crc_current_status.stdout }}"
    crc_is_stopped: "{{ crc_current_status.stdout is defined and 'Stopped' in crc_current_status.stdout }}"
    crc_needs_setup: "{{ crc_current_status.stderr is defined and ('setup' in crc_current_status.stderr or 'not exist' in crc_current_status.stderr) }}"
  when: crc_binary_exists.stat.exists

- name: Set CRC status for non-existent binary
  set_fact:
    crc_is_running: false
    crc_is_stopped: false
    crc_needs_setup: true
  when: not crc_binary_exists.stat.exists

- name: Display CRC current status
  debug:
    msg: |
      📊 CRC Status Check for {{ inventory_hostname }}:
      
      Binary exists: {{ crc_binary_exists.stat.exists }}
      {% if crc_current_status.stdout is defined %}
      Status output: {{ crc_current_status.stdout }}
      {% endif %}
      {% if crc_current_status.stderr is defined %}
      Status error: {{ crc_current_status.stderr }}
      {% endif %}
      
      🎯 Deployment Plan:
      {% if crc_is_running %}
      ✅ CRC is already running - will skip setup and start phases
      {% elif crc_is_stopped %}
      🔄 CRC is stopped - will skip setup but start the cluster
      {% elif crc_needs_setup %}
      🏗️  CRC needs setup - will perform full setup and start
      {% else %}
      ❓ CRC status unknown - will attempt full deployment
      {% endif %}

- name: Set skip flags based on CRC status
  set_fact:
    skip_crc_setup: "{{ crc_is_running and crc_skip_if_running }}"
    skip_crc_start: "{{ crc_is_running and crc_skip_if_running }}"
    skip_crc_install: "{{ crc_binary_exists.stat.exists and (crc_is_running or crc_is_stopped) }}"