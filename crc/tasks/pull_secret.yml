---
# Pull secret management for CRC

- name: Check if pull secret exists in ai-workspace
  stat:
    path: "{{ crc_pull_secret_path }}"
  register: pull_secret_local
  delegate_to: localhost
  run_once: true
  when: crc_pull_secret_path != ""

- name: Display pull secret status
  debug:
    msg: |
      {% if crc_pull_secret_path == "" %}
      ⚠️  No pull secret path configured - CRC will use /dev/null
      {% elif pull_secret_local.stat.exists %}
      ✅ Pull secret found at {{ crc_pull_secret_path }}
      {% else %}
      ❌ Pull secret not found at {{ crc_pull_secret_path }}
      {% endif %}

- name: Copy pull secret to target server
  copy:
    src: "{{ crc_pull_secret_path }}"
    dest: "{{ crc_pull_secret_dest }}"
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
    mode: '0600'
  become: yes
  when: 
    - crc_pull_secret_path != ""
    - pull_secret_local.stat.exists
  register: pull_secret_copied

- name: Set pull secret path for CRC configuration
  set_fact:
    crc_effective_pull_secret: "{{ crc_pull_secret_dest if pull_secret_copied is defined and pull_secret_copied.changed else '/dev/null' }}"

- name: Display effective pull secret configuration
  debug:
    msg: "CRC will use pull secret: {{ crc_effective_pull_secret }}"