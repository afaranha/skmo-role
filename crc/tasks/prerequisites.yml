---
- name: Install required system packages
  package:
    name: "{{ crc_required_packages }}"
    state: present
  become: yes

- name: Create CRC user if not exists
  user:
    name: "{{ crc_user }}"
    state: present
    shell: /bin/bash
    create_home: yes
  become: yes

- name: Add CRC user to required groups
  user:
    name: "{{ crc_user }}"
    groups: wheel
    append: yes
  become: yes
  when: crc_setup_sudoers | bool

- name: Configure passwordless sudo for CRC user
  lineinfile:
    path: "/etc/sudoers.d/{{ crc_user }}"
    create: yes
    line: "{{ crc_user }} ALL=(ALL) NOPASSWD:ALL"
    mode: '0440'
  become: yes
  when: crc_setup_sudoers | bool

- name: Create CRC directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
  loop:
    - "{{ crc_install_dir }}"
    - "{{ crc_openstack_dir }}"
  become: yes

- name: Configure firewall for CRC (if enabled)
  firewalld:
    port: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop:
    - "6443/tcp"    # OpenShift API
    - "80/tcp"      # HTTP
    - "443/tcp"     # HTTPS
    - "22623/tcp"   # Machine config server
  become: yes
  when: crc_configure_firewall | bool
  ignore_errors: yes  # Firewall might not be running

- name: Check available disk space
  shell: df -h {{ crc_install_dir | dirname }} | awk 'NR==2 {print $4}' | sed 's/G//'
  register: available_space
  changed_when: false

- name: Verify sufficient disk space
  assert:
    that:
      - available_space.stdout | int >= (crc_disk_size | int + 10)
    fail_msg: "Insufficient disk space. Need {{ crc_disk_size | int + 10 }}GB, have {{ available_space.stdout }}GB"