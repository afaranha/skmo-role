---
# Enhanced OpenStack deployment using install_yamls repository
# Following the official documentation at https://github.com/openstack-k8s-operators/install_yamls

# Choose deployment method based on configuration
- name: Include advanced deployment
  include_tasks: openstack_advanced.yml
  when: crc_use_advanced_deployment | default(false) | bool

- name: Standard OpenStack deployment
  block:
    - name: Set OpenStack deployment variables
  set_fact:
    install_yamls_path: "{{ crc_openstack_dir }}/install_yamls"
    openstack_namespace: "{{ crc_workload_namespace | default('openstack') }}"
    operator_namespace: "{{ crc_operator_namespace }}"
    openstack_password: "{{ crc_openstack_password }}"
    current_server: "{{ inventory_hostname }}"
    region_name: "{{ region_name | default('region-1') }}"
    is_region_zero: "{{ inventory_hostname == groups['crc_servers'][0] if groups is defined else true }}"

- name: Display OpenStack deployment plan
  debug:
    msg: |
      🚀 OpenStack Deployment Plan:
      
      Server: {{ current_server }}
      Region: {{ region_name }} {{ '(Region Zero - Identity)' if is_region_zero else '(Workload Region)' }}
      Workload Namespace: {{ openstack_namespace }}
      Operator Namespace: {{ operator_namespace }} (shared across regions)
      Network Isolation: {{ crc_network_isolation }}
      Network Ranges: {{ crc_network_ranges | join(', ') if crc_network_ranges else 'Default' }}

- name: Clone OpenStack install_yamls repository
  git:
    repo: "{{ crc_openstack_repo }}"
    dest: "{{ install_yamls_path }}"
    force: yes
    version: main
  become_user: "{{ crc_user }}"
  become: yes

- name: Setup oc environment and login
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    oc login -u kubeadmin -p {{ crc_kubeadmin_password }} https://api.crc.testing:6443
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: oc_login

- name: Verify cluster connectivity
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    oc whoami
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: cluster_user
  changed_when: false

- name: Display cluster connection info
  debug:
    msg: "✅ Connected to {{ current_server }} as {{ cluster_user.stdout }}"

# Phase 1: Create namespaces
- name: Create OpenStack operator namespace (shared)
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    oc create namespace {{ operator_namespace }} || true
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes

- name: Create OpenStack workload namespace
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    oc create namespace {{ openstack_namespace }} || true
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes

# Phase 2: Storage setup (following install_yamls documentation)
- name: Setup CRC storage for OpenStack
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    make crc_storage
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: storage_setup
  failed_when: false

- name: Display storage setup result
  debug:
    msg: |
      {% if storage_setup.rc == 0 %}
      ✅ CRC Storage setup completed successfully
      {% else %}
      ⚠️  Storage setup warning (may already be configured): {{ storage_setup.stderr | default('No error details') }}
      {% endif %}

# Phase 3: Input secrets (following install_yamls documentation)
- name: Create OpenStack input secrets
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    make input
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
    PASSWORD: "{{ openstack_password }}"
    SECRET: "osp-secret"
  become_user: "{{ crc_user }}"
  become: yes
  register: input_secrets

- name: Display input secrets result
  debug:
    msg: "✅ Input secrets created for {{ openstack_namespace }}"

# Phase 4: Install OpenStack operators (following install_yamls documentation)
- name: Install OpenStack operators
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    make openstack
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
    NETWORK_ISOLATION: "{{ crc_network_isolation | string | lower }}"
    TIMEOUT: "{{ crc_openstack_timeout }}"
    # Network configuration if specified
    NETWORK_INTERNALAPI_ADDRESS_PREFIX: "{{ crc_network_ranges[0] if crc_network_ranges | length > 0 else '' }}"
    NETWORK_STORAGE_ADDRESS_PREFIX: "{{ crc_network_ranges[1] if crc_network_ranges | length > 1 else '' }}"
    NETWORK_TENANT_ADDRESS_PREFIX: "{{ crc_network_ranges[2] if crc_network_ranges | length > 2 else '' }}"
    NETWORK_STORAGEMGMT_ADDRESS_PREFIX: "{{ crc_network_ranges[3] if crc_network_ranges | length > 3 else '' }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: operator_install
  async: 1200  # 20 minutes
  poll: 30

- name: Display operator installation result
  debug:
    msg: |
      {% if operator_install.rc == 0 %}
      ✅ OpenStack operators installed successfully
      {% else %}
      ❌ OpenStack operator installation failed
      {% endif %}

# Phase 5: Initialize OpenStack operators (following install_yamls documentation)
- name: Initialize OpenStack operators
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    make openstack_init
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: openstack_init

- name: Display operator initialization result
  debug:
    msg: |
      {% if openstack_init.rc == 0 %}
      ✅ OpenStack operators initialized successfully
      {% else %}
      ❌ OpenStack operator initialization failed
      {% endif %}

# Phase 6: Deploy OpenStack control plane (following install_yamls documentation)
- name: Deploy OpenStack control plane
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    make openstack_deploy
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
    NETWORK_ISOLATION: "{{ crc_network_isolation | string | lower }}"
    TIMEOUT: "{{ crc_openstack_timeout }}"
    # Network configuration if specified
    NETWORK_INTERNALAPI_ADDRESS_PREFIX: "{{ crc_network_ranges[0] if crc_network_ranges | length > 0 else '' }}"
    NETWORK_STORAGE_ADDRESS_PREFIX: "{{ crc_network_ranges[1] if crc_network_ranges | length > 1 else '' }}"
    NETWORK_TENANT_ADDRESS_PREFIX: "{{ crc_network_ranges[2] if crc_network_ranges | length > 2 else '' }}"
    NETWORK_STORAGEMGMT_ADDRESS_PREFIX: "{{ crc_network_ranges[3] if crc_network_ranges | length > 3 else '' }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: openstack_deploy
  async: "{{ crc_openstack_timeout | int }}"
  poll: 45

- name: Display control plane deployment result
  debug:
    msg: |
      {% if openstack_deploy.rc == 0 %}
      ✅ OpenStack control plane deployment initiated successfully
      {% else %}
      ❌ OpenStack control plane deployment failed
      {% endif %}

# Phase 7: Wait for deployment readiness (optional for region zero)
- name: Wait for OpenStack control plane readiness
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    make openstack_wait_deploy
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
    TIMEOUT: "{{ crc_openstack_timeout }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: openstack_wait
  failed_when: false
  when: is_region_zero  # Only wait for region zero initially to save time

# Phase 8: Get deployment status and validation
- name: Get OpenStack control plane status
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    oc get openstackcontrolplane -n {{ openstack_namespace }}
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: controlplane_status
  failed_when: false
  changed_when: false

- name: Get operator status
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    oc get subscription,csv -n {{ operator_namespace }}
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: operator_status
  failed_when: false
  changed_when: false

- name: Get running pods count
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    oc get pods -n {{ openstack_namespace }} --no-headers | grep -E "(Running|Completed)" | wc -l
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: running_pods
  failed_when: false
  changed_when: false

- name: Get all pods status
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    oc get pods -n {{ openstack_namespace }}
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: all_pods_status
  failed_when: false
  changed_when: false

# Phase 9: Generate monitoring and access scripts
- name: Create OpenStack monitoring script
  template:
    src: openstack_monitor.sh.j2
    dest: "/home/{{ crc_user }}/monitor-openstack-{{ current_server }}.sh"
    mode: '0755'
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
  become: yes
  vars:
    template_content: |
      #!/bin/bash
      # OpenStack monitoring script for {{ current_server }}
      # Generated on: {{ ansible_date_time.iso8601 }}
      
      export PATH=$PATH:{{ crc_install_dir }}
      eval $({{ crc_install_dir }}/crc oc-env)
      
      echo "🔍 OpenStack Status for {{ current_server }}"
      echo "========================================"
      echo "Region: {{ region_name }} {{ '(Region Zero)' if is_region_zero else '(Workload)' }}"
      echo "Namespace: {{ openstack_namespace }}"
      echo "Operator Namespace: {{ operator_namespace }}"
      echo "Date: $(date)"
      echo ""
      
      echo "📋 Operator Status:"
      oc get subscription,csv -n {{ operator_namespace }} 2>/dev/null || echo "No operators found"
      echo ""
      
      echo "🏗️  OpenStack Control Plane:"
      oc get openstackcontrolplane -n {{ openstack_namespace }} 2>/dev/null || echo "No control plane found"
      echo ""
      
      echo "🚀 Pod Status (Running/Completed):"
      RUNNING_PODS=$(oc get pods -n {{ openstack_namespace }} --no-headers 2>/dev/null | grep -E "(Running|Completed)" | wc -l)
      TOTAL_PODS=$(oc get pods -n {{ openstack_namespace }} --no-headers 2>/dev/null | wc -l)
      echo "Running/Completed: $RUNNING_PODS/$TOTAL_PODS"
      echo ""
      
      echo "📦 Key Pods:"
      oc get pods -n {{ openstack_namespace }} 2>/dev/null | grep -E "(keystone|nova|glance|neutron|cinder|heat|octavia)" | head -10 || echo "No key service pods found yet"
      echo ""
      
      echo "🌐 Services:"
      oc get svc -n {{ openstack_namespace }} 2>/dev/null | head -5 || echo "No services found"
      echo ""
      
      echo "🔗 Routes:"
      oc get routes -n {{ openstack_namespace }} 2>/dev/null || echo "No routes found"
      echo ""
      
      echo "🔧 Network Attachments:"
      oc get network-attachment-definitions -n {{ openstack_namespace }} 2>/dev/null || echo "No network attachments found"
      echo ""
      
      echo "💻 OpenStack CLI Test:"
      if oc get pod/openstackclient -n {{ openstack_namespace }} >/dev/null 2>&1; then
        POD_STATUS=$(oc get pod/openstackclient -n {{ openstack_namespace }} -o jsonpath='{.status.phase}' 2>/dev/null)
        if [ "$POD_STATUS" = "Running" ]; then
          echo "Testing OpenStack CLI..."
          oc rsh -n {{ openstack_namespace }} openstackclient openstack token issue 2>/dev/null || echo "OpenStack not ready yet"
        else
          echo "openstackclient pod status: $POD_STATUS"
        fi
      else
        echo "openstackclient pod not found"
      fi
      
      echo ""
      echo "🛠️  Manual Commands:"
      echo "Check status: oc get openstackcontrolplane -n {{ openstack_namespace }}"
      echo "Watch progress: oc get pods -n {{ openstack_namespace }} -w"
      echo "Check events: oc get events -n {{ openstack_namespace }} --sort-by='.lastTimestamp' | tail -10"
      echo ""
      echo "📖 Continue with install_yamls:"
      echo "  cd {{ install_yamls_path }}"
      echo "  export NAMESPACE={{ openstack_namespace }}"
      echo "  export OPERATOR_NAMESPACE={{ operator_namespace }}"
      echo "  make openstack_wait_deploy"

- name: Create deployment configuration documentation
  copy:
    content: |
      # OpenStack Deployment Configuration - {{ current_server }}
      
      **Generated:** {{ ansible_date_time.iso8601 }}  
      **Server:** {{ current_server }}  
      **Region:** {{ region_name }} {{ '(Region Zero - Identity Service)' if is_region_zero else '(Workload Region)' }}
      
      ## Deployment Summary
      
      | Component | Status |
      |-----------|---------|
      | Storage Setup | {{ '✅ Success' if storage_setup.rc == 0 else '⚠️ Warning' }} |
      | Input Secrets | {{ '✅ Success' if input_secrets.rc == 0 else '❌ Failed' }} |
      | Operator Install | {{ '✅ Success' if operator_install.rc == 0 else '❌ Failed' }} |
      | Operator Init | {{ '✅ Success' if openstack_init.rc == 0 else '❌ Failed' }} |
      | Control Plane Deploy | {{ '✅ Success' if openstack_deploy.rc == 0 else '❌ Failed' }} |
      {% if openstack_wait is defined %}
      | Readiness Wait | {{ '✅ Success' if openstack_wait.rc == 0 else '⏳ Pending' }} |
      {% endif %}
      
      ## Namespaces
      - **OpenStack Workload:** `{{ openstack_namespace }}`
      - **Operators:** `{{ operator_namespace }}` (shared across regions)
      
      ## Network Configuration
      {% if crc_network_isolation %}
      **Network Isolation:** Enabled
      {% if crc_network_ranges | length > 0 %}
      - **Internal API:** {{ crc_network_ranges[0] }}.x
      {% if crc_network_ranges | length > 1 %}
      - **Storage:** {{ crc_network_ranges[1] }}.x
      {% endif %}
      {% if crc_network_ranges | length > 2 %}
      - **Tenant:** {{ crc_network_ranges[2] }}.x
      {% endif %}
      {% if crc_network_ranges | length > 3 %}
      - **Storage Mgmt:** {{ crc_network_ranges[3] }}.x
      {% endif %}
      {% else %}
      **Network Ranges:** Default
      {% endif %}
      {% else %}
      **Network Isolation:** Disabled
      {% endif %}
      
      ## Environment Variables Used
      ```bash
      export NAMESPACE={{ openstack_namespace }}
      export OPERATOR_NAMESPACE={{ operator_namespace }}
      export NETWORK_ISOLATION={{ crc_network_isolation | string | lower }}
      export PASSWORD={{ openstack_password }}
      export TIMEOUT={{ crc_openstack_timeout }}
      {% if crc_network_ranges | length > 0 %}
      export NETWORK_INTERNALAPI_ADDRESS_PREFIX={{ crc_network_ranges[0] }}
      {% endif %}
      {% if crc_network_ranges | length > 1 %}
      export NETWORK_STORAGE_ADDRESS_PREFIX={{ crc_network_ranges[1] }}
      {% endif %}
      {% if crc_network_ranges | length > 2 %}
      export NETWORK_TENANT_ADDRESS_PREFIX={{ crc_network_ranges[2] }}
      {% endif %}
      {% if crc_network_ranges | length > 3 %}
      export NETWORK_STORAGEMGMT_ADDRESS_PREFIX={{ crc_network_ranges[3] }}
      {% endif %}
      ```
      
      ## Install_yamls Commands Used
      ```bash
      cd {{ install_yamls_path }}
      
      # Setup storage
      make crc_storage
      
      # Create input secrets
      make input
      
      # Install operators
      make openstack
      
      # Initialize operators
      make openstack_init
      
      # Deploy control plane
      make openstack_deploy
      
      # Wait for completion
      make openstack_wait_deploy
      ```
      
      ## Access Commands
      ```bash
      # Check deployment status
      oc get openstackcontrolplane -n {{ openstack_namespace }}
      
      # Check pods
      oc get pods -n {{ openstack_namespace }}
      
      # Check operators
      oc get subscription,csv -n {{ operator_namespace }}
      
      # Access OpenStack CLI (when ready)
      oc rsh -n {{ openstack_namespace }} openstackclient
      
      # Get service URLs
      oc get routes -n {{ openstack_namespace }}
      ```
      
      ## Current Status
      
      ### Control Plane
      ```
      {{ controlplane_status.stdout if controlplane_status.rc == 0 else 'Not available yet' }}
      ```
      
      ### Operators
      ```
      {{ operator_status.stdout if operator_status.rc == 0 else 'Not available yet' }}
      ```
      
      ### Pods Summary
      **Running/Completed Pods:** {{ running_pods.stdout if running_pods.rc == 0 else '0' }}
      
      ### All Pods
      ```
      {{ all_pods_status.stdout if all_pods_status.rc == 0 else 'No pods found' }}
      ```
      
      ## Monitoring
      - **Monitor script:** `./monitor-openstack-{{ current_server }}.sh`
      - **Install_yamls path:** `{{ install_yamls_path }}`
      
      ## Next Steps
      1. Monitor deployment progress: `./monitor-openstack-{{ current_server }}.sh`
      2. Wait for completion: `cd {{ install_yamls_path }} && make openstack_wait_deploy`
      3. Access OpenStack: `oc rsh -n {{ openstack_namespace }} openstackclient`
      4. Configure SKMO networking between regions (if multi-region)
    dest: "/home/{{ crc_user }}/openstack-config-{{ current_server }}.md"
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
    mode: '0644'
  become: yes

# Phase 10: Final deployment status summary
- name: Display final OpenStack deployment status
  debug:
    msg: |
      🎉 OpenStack Deployment Summary for {{ current_server }}
      =================================================
      
      📍 **Location:** {{ current_server }} ({{ region_name }})
      📁 **Workload Namespace:** {{ openstack_namespace }}
      🔧 **Operator Namespace:** {{ operator_namespace }}
      🌐 **Network Isolation:** {{ 'Enabled' if crc_network_isolation else 'Disabled' }}
      
      📊 **Deployment Results:**
      {% if storage_setup.rc == 0 %}
      ✅ Storage: SUCCESS
      {% else %}
      ⚠️  Storage: WARNING (may be pre-configured)
      {% endif %}
      {% if input_secrets.rc == 0 %}
      ✅ Secrets: SUCCESS
      {% else %}
      ❌ Secrets: FAILED
      {% endif %}
      {% if operator_install.rc == 0 %}
      ✅ Operators: SUCCESS
      {% else %}
      ❌ Operators: FAILED
      {% endif %}
      {% if openstack_init.rc == 0 %}
      ✅ Initialization: SUCCESS
      {% else %}
      ❌ Initialization: FAILED
      {% endif %}
      {% if openstack_deploy.rc == 0 %}
      ✅ Control Plane: SUCCESS
      {% else %}
      ❌ Control Plane: FAILED
      {% endif %}
      
      🚀 **Pod Status:** {{ running_pods.stdout if running_pods.rc == 0 else '0' }} running/completed
      
      📁 **Generated Files:**
      - Monitor: `/home/{{ crc_user }}/monitor-openstack-{{ current_server }}.sh`
      - Config: `/home/{{ crc_user }}/openstack-config-{{ current_server }}.md`
      
      🔧 **Next Steps:**
      1. Monitor: `ssh {{ crc_user }}@{{ ansible_host }} ./monitor-openstack-{{ current_server }}.sh`
      2. Wait for completion: `cd {{ install_yamls_path }} && make openstack_wait_deploy`
      3. Access OpenStack CLI when ready
      
      {% if not is_region_zero %}
      🔗 **Multi-Region Note:** This is a workload region. Configure SKMO networking to connect to Region Zero.
      {% endif %}

  when: not (crc_use_advanced_deployment | default(false) | bool)