---
# Advanced OpenStack deployment integrating ai-workspace playbook patterns
# This task provides enterprise-grade deployment with comprehensive validation

- name: Set advanced deployment variables
  set_fact:
    install_yamls_path: "{{ crc_openstack_dir }}/install_yamls"
    openstack_namespace: "{{ crc_workload_namespace | default('openstack') }}"
    operator_namespace: "{{ crc_operator_namespace }}"
    current_server: "{{ inventory_hostname }}"
    region_name: "{{ region_name | default('region-1') }}"
    is_region_zero: "{{ inventory_hostname == groups['crc_servers'][0] if groups is defined else true }}"
    network_config:
      internalapi_prefix: "{{ crc_network_ranges[0] if crc_network_ranges | length > 0 else '172.17.0' }}"
      storage_prefix: "{{ crc_network_ranges[1] if crc_network_ranges | length > 1 else '172.18.0' }}"
      tenant_prefix: "{{ crc_network_ranges[2] if crc_network_ranges | length > 2 else '172.19.0' }}"
      storagemgmt_prefix: "{{ crc_network_ranges[3] if crc_network_ranges | length > 3 else '172.20.0' }}"

- name: Display advanced deployment plan
  debug:
    msg: |
      🚀 Advanced OpenStack Deployment Plan:
      
      📍 Server: {{ current_server }}
      🏷️  Region: {{ region_name }} {{ '(Region Zero - Identity Service)' if is_region_zero else '(Workload Region)' }}
      📁 Workload Namespace: {{ openstack_namespace }}
      🔧 Operator Namespace: {{ operator_namespace }} (shared)
      🌐 Network Isolation: {{ crc_network_isolation }}
      
      🔗 Network Configuration:
      - Internal API: {{ network_config.internalapi_prefix }}.x
      - Storage: {{ network_config.storage_prefix }}.x  
      - Tenant: {{ network_config.tenant_prefix }}.x
      - Storage Mgmt: {{ network_config.storagemgmt_prefix }}.x

# Phase 1: Repository and environment setup using install_yamls methodology
- name: Clone install_yamls repository
  git:
    repo: "{{ crc_openstack_repo }}"
    dest: "{{ install_yamls_path }}"
    force: yes
    version: main
  become_user: "{{ crc_user }}"
  become: yes

- name: Use install_yamls to setup CRC with proper pull secret
  shell: |
    cd {{ install_yamls_path }}
    export PULL_SECRET=$HOME/pull-secret.txt
    echo "Setting up CRC using install_yamls with pull secret..."
    make crc
    echo "CRC setup completed successfully"
  environment:
    HOME: "/home/{{ crc_user }}"
    PATH: "{{ ansible_env.PATH }}:{{ crc_install_dir }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: crc_setup_result
  async: 1800  # 30 minutes timeout
  poll: 60

- name: Setup oc environment and authenticate
  shell: |
    cd {{ install_yamls_path }}
    eval $(crc oc-env)
    oc login -u kubeadmin -p $(crc console --credentials | grep kubeadmin | grep -oP 'password: \K.*')
    oc whoami
  environment:
    HOME: "/home/{{ crc_user }}"
    PATH: "{{ ansible_env.PATH }}:{{ crc_install_dir }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: oc_auth

- name: Verify cluster connectivity and display info
  debug:
    msg: "✅ Authenticated to {{ current_server }} as {{ oc_auth.stdout_lines[-1] }}"

# Phase 2: Namespace creation and labeling
- name: Create and configure operator namespace
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    oc create namespace {{ operator_namespace }} || true
    oc label namespace {{ operator_namespace }} openstack.org/operator=true --overwrite
    oc label namespace {{ operator_namespace }} region={{ region_name }} --overwrite
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes

- name: Create and configure workload namespace
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    oc create namespace {{ openstack_namespace }} || true
    oc label namespace {{ openstack_namespace }} openstack.org/workload=true --overwrite
    oc label namespace {{ openstack_namespace }} openstack.org/region={{ region_name }} --overwrite
    oc label namespace {{ openstack_namespace }} openstack.org/region-zero={{ is_region_zero | string | lower }} --overwrite
    {% if crc_network_isolation %}
    oc label namespace {{ openstack_namespace }} openstack.org/network-isolation=true --overwrite
    {% endif %}
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes

# Phase 3: Storage configuration (enhanced)
- name: Configure CRC storage with validation
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    echo "Setting up CRC storage..."
    make crc_storage
    
    echo "Verifying storage setup..."
    oc get storageclass local-storage || echo "⚠️ local-storage not found"
    oc get pv | grep local-storage || echo "⚠️ No local-storage PVs found"
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: storage_result

- name: Display storage configuration result
  debug:
    msg: |
      {% if storage_result.rc == 0 %}
      ✅ Storage configuration completed
      {% else %}
      ⚠️  Storage configuration warning: {{ storage_result.stderr | default('Unknown error') }}
      {% endif %}

# Phase 4: Enhanced input secrets with validation
- name: Create OpenStack input secrets with validation
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    echo "Creating input secrets..."
    make input
    
    echo "Validating secrets..."
    oc get secret osp-secret -n {{ openstack_namespace }} && echo "✅ osp-secret created" || echo "❌ osp-secret missing"
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
    PASSWORD: "{{ crc_openstack_password }}"
    SECRET: "osp-secret"
  become_user: "{{ crc_user }}"
  become: yes
  register: secrets_result

# Phase 5: Operator installation with comprehensive environment
- name: Install OpenStack operators with network isolation
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    echo "Installing OpenStack operators..."
    make openstack
    
    echo "Waiting for operator subscriptions..."
    sleep 30
    oc get subscription -n {{ operator_namespace }} || echo "No subscriptions found yet"
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
    NETWORK_ISOLATION: "{{ crc_network_isolation | string | lower }}"
    TIMEOUT: "{{ crc_openstack_timeout }}"
    # Network isolation variables (following install_yamls documentation)
    NETWORK_INTERNALAPI_ADDRESS_PREFIX: "{{ network_config.internalapi_prefix }}"
    NETWORK_STORAGE_ADDRESS_PREFIX: "{{ network_config.storage_prefix }}"
    NETWORK_TENANT_ADDRESS_PREFIX: "{{ network_config.tenant_prefix }}"
    NETWORK_STORAGEMGMT_ADDRESS_PREFIX: "{{ network_config.storagemgmt_prefix }}"
    # Additional environment variables for robustness
    STORAGE_CLASS: "local-storage"
    OPENSTACK_RELEASE: "antelope"  # or current release
  become_user: "{{ crc_user }}"
  become: yes
  register: operator_result
  async: 1500  # 25 minutes for operator installation
  poll: 45

# Phase 6: Operator validation before proceeding
- name: Validate operator installation
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    
    echo "Checking operator subscriptions..."
    SUBSCRIPTIONS=$(oc get subscription -n {{ operator_namespace }} --no-headers | wc -l)
    echo "Found $SUBSCRIPTIONS subscriptions"
    
    echo "Checking operator CSV status..."
    CSV_COUNT=$(oc get csv -n {{ operator_namespace }} --no-headers | grep -c "Succeeded" || echo "0")
    echo "$CSV_COUNT operators in Succeeded state"
    
    if [ "$CSV_COUNT" -gt 0 ]; then
      echo "✅ Operators are ready"
      exit 0
    else
      echo "⚠️ Operators still installing..."
      oc get csv -n {{ operator_namespace }}
      exit 1
    fi
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: operator_validation
  retries: 10
  delay: 60
  until: operator_validation.rc == 0

# Phase 7: Initialize OpenStack operators
- name: Initialize OpenStack operators
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    echo "Initializing OpenStack operators..."
    make openstack_init
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: init_result

# Phase 8: Deploy OpenStack control plane with enhanced configuration
- name: Deploy OpenStack control plane
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    cd {{ install_yamls_path }}
    echo "Deploying OpenStack control plane..."
    make openstack_deploy
    
    echo "Checking initial deployment status..."
    sleep 60
    oc get openstackcontrolplane -n {{ openstack_namespace }} || echo "Control plane not created yet"
  environment:
    HOME: "/home/{{ crc_user }}"
    NAMESPACE: "{{ openstack_namespace }}"
    OPERATOR_NAMESPACE: "{{ operator_namespace }}"
    NETWORK_ISOLATION: "{{ crc_network_isolation | string | lower }}"
    TIMEOUT: "{{ crc_openstack_timeout }}"
    # Enhanced network configuration
    NETWORK_INTERNALAPI_ADDRESS_PREFIX: "{{ network_config.internalapi_prefix }}"
    NETWORK_STORAGE_ADDRESS_PREFIX: "{{ network_config.storage_prefix }}"
    NETWORK_TENANT_ADDRESS_PREFIX: "{{ network_config.tenant_prefix }}"
    NETWORK_STORAGEMGMT_ADDRESS_PREFIX: "{{ network_config.storagemgmt_prefix }}"
    # Additional deployment variables
    STORAGE_CLASS: "local-storage"
    OPENSTACK_RELEASE: "antelope"
    ADMIN_PASSWORD: "{{ crc_openstack_password }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: deploy_result
  async: "{{ crc_openstack_timeout | int }}"
  poll: 60

# Phase 9: Enhanced deployment monitoring and validation
- name: Monitor deployment progress
  shell: |
    export PATH=$PATH:{{ crc_install_dir }}
    eval $({{ crc_install_dir }}/crc oc-env)
    
    echo "=== OpenStack Control Plane Status ==="
    oc get openstackcontrolplane -n {{ openstack_namespace }} 2>/dev/null || echo "Control plane not ready"
    
    echo -e "\n=== Pod Summary ==="
    TOTAL_PODS=$(oc get pods -n {{ openstack_namespace }} --no-headers 2>/dev/null | wc -l)
    RUNNING_PODS=$(oc get pods -n {{ openstack_namespace }} --no-headers 2>/dev/null | grep -E "(Running|Completed)" | wc -l)
    echo "Pods: $RUNNING_PODS/$TOTAL_PODS running/completed"
    
    echo -e "\n=== Key Service Pods ==="
    oc get pods -n {{ openstack_namespace }} 2>/dev/null | grep -E "(keystone|nova|glance|neutron|cinder)" | head -10 || echo "Core services not started yet"
    
    echo -e "\n=== Recent Events ==="
    oc get events -n {{ openstack_namespace }} --sort-by='.lastTimestamp' 2>/dev/null | tail -5 || echo "No events found"
    
    if [ "$RUNNING_PODS" -gt 5 ]; then
      echo -e "\n✅ Deployment progressing well"
      exit 0
    else
      echo -e "\n⏳ Deployment still starting..."
      exit 1
    fi
  environment:
    HOME: "/home/{{ crc_user }}"
  become_user: "{{ crc_user }}"
  become: yes
  register: deployment_monitor
  failed_when: false

# Phase 10: Generate comprehensive management scripts
- name: Create advanced monitoring script
  copy:
    content: |
      #!/bin/bash
      # Advanced OpenStack monitoring for {{ current_server }}
      # Generated: {{ ansible_date_time.iso8601 }}
      
      export PATH=$PATH:{{ crc_install_dir }}
      eval $({{ crc_install_dir }}/crc oc-env)
      
      echo "🔍 Advanced OpenStack Monitoring - {{ current_server }}"
      echo "=================================================="
      echo "Region: {{ region_name }} {{ '(Region Zero)' if is_region_zero else '(Workload)' }}"
      echo "Generated: {{ ansible_date_time.iso8601 }}"
      echo ""
      
      # Function to check component status
      check_component() {
        local component=$1
        local namespace=$2
        echo "🔧 $component Status:"
        case $component in
          "operators")
            oc get subscription,csv -n $namespace 2>/dev/null | head -10 || echo "No operators found"
            ;;
          "controlplane")
            oc get openstackcontrolplane -n $namespace 2>/dev/null || echo "No control plane found"
            ;;
          "pods")
            local total=$(oc get pods -n $namespace --no-headers 2>/dev/null | wc -l)
            local running=$(oc get pods -n $namespace --no-headers 2>/dev/null | grep -E "(Running|Completed)" | wc -l)
            echo "Total pods: $total, Running/Completed: $running"
            oc get pods -n $namespace 2>/dev/null | grep -E "(keystone|nova|glance|neutron|cinder|heat)" | head -8 || echo "Core services not ready"
            ;;
          "services")
            oc get svc -n $namespace 2>/dev/null | grep -E "(keystone|nova|glance|neutron)" | head -5 || echo "Core services not found"
            ;;
          "routes")
            oc get routes -n $namespace 2>/dev/null || echo "No routes found"
            ;;
          "networks")
            oc get network-attachment-definitions -n $namespace 2>/dev/null || echo "No network attachments found"
            ;;
        esac
        echo ""
      }
      
      # Main monitoring
      check_component "operators" "{{ operator_namespace }}"
      check_component "controlplane" "{{ openstack_namespace }}"
      check_component "pods" "{{ openstack_namespace }}"
      check_component "services" "{{ openstack_namespace }}"
      check_component "routes" "{{ openstack_namespace }}"
      {% if crc_network_isolation %}
      check_component "networks" "{{ openstack_namespace }}"
      {% endif %}
      
      echo "💻 OpenStack CLI Test:"
      if oc get pod/openstackclient -n {{ openstack_namespace }} >/dev/null 2>&1; then
        POD_STATUS=$(oc get pod/openstackclient -n {{ openstack_namespace }} -o jsonpath='{.status.phase}' 2>/dev/null)
        if [ "$POD_STATUS" = "Running" ]; then
          echo "✅ Testing OpenStack authentication..."
          oc rsh -n {{ openstack_namespace }} openstackclient openstack token issue 2>/dev/null | head -10 || echo "⚠️ Authentication not ready"
        else
          echo "⏳ OpenStack CLI pod status: $POD_STATUS"
        fi
      else
        echo "⏳ OpenStack CLI pod not found"
      fi
      
      echo ""
      echo "🛠️ Management Commands:"
      echo "Full status: oc get openstackcontrolplane -n {{ openstack_namespace }} -o yaml"
      echo "Watch pods: oc get pods -n {{ openstack_namespace }} -w"
      echo "Events: oc get events -n {{ openstack_namespace }} --sort-by='.lastTimestamp' | tail -20"
      echo "Logs: oc logs -n {{ openstack_namespace }} <pod-name>"
      echo ""
      echo "📖 Continue deployment:"
      echo "cd {{ install_yamls_path }}"
      echo "export NAMESPACE={{ openstack_namespace }}"
      echo "export OPERATOR_NAMESPACE={{ operator_namespace }}"
      echo "make openstack_wait_deploy"
    dest: "/home/{{ crc_user }}/monitor-advanced-{{ current_server }}.sh"
    mode: '0755'
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
  become: yes

# Phase 11: Create comprehensive deployment documentation
- name: Generate deployment documentation
  copy:
    content: |
      # Advanced OpenStack Deployment Report - {{ current_server }}
      
      **Generated:** {{ ansible_date_time.iso8601 }}  
      **Server:** {{ current_server }}  
      **Region:** {{ region_name }} {{ '(Region Zero - Identity Service)' if is_region_zero else '(Workload Region)' }}  
      **Deployment Method:** Advanced with AI Workspace Integration
      
      ## Deployment Results
      
      | Phase | Component | Status | Notes |
      |-------|-----------|---------|-------|
      | 1 | Repository Setup | ✅ Success | install_yamls cloned |
      | 2 | Authentication | ✅ Success | {{ oc_auth.stdout_lines[-1] if oc_auth is defined }} |
      | 3 | Namespaces | ✅ Success | Labeled and configured |
      | 4 | Storage | {{ '✅ Success' if storage_result.rc == 0 else '⚠️ Warning' }} | CRC local storage |
      | 5 | Secrets | {{ '✅ Success' if secrets_result.rc == 0 else '❌ Failed' }} | Input secrets created |
      | 6 | Operators | {{ '✅ Success' if operator_result.rc == 0 else '❌ Failed' }} | {{ operator_validation.stdout_lines[-1] if operator_validation is defined }} |
      | 7 | Initialization | {{ '✅ Success' if init_result.rc == 0 else '❌ Failed' }} | Operator initialization |
      | 8 | Control Plane | {{ '✅ Success' if deploy_result.rc == 0 else '❌ Failed' }} | OpenStack deployment |
      | 9 | Monitoring | {{ '✅ Ready' if deployment_monitor.rc == 0 else '⏳ Starting' }} | Deployment monitoring |
      
      ## Configuration Details
      
      ### Namespaces
      - **OpenStack Workload:** `{{ openstack_namespace }}`
      - **Operators:** `{{ operator_namespace }}` (shared across regions)
      
      ### Network Configuration
      {% if crc_network_isolation %}
      **Network Isolation:** ✅ Enabled
      
      | Network | Prefix | Usage |
      |---------|---------|-------|
      | Internal API | {{ network_config.internalapi_prefix }}.x | Service endpoints |
      | Storage | {{ network_config.storage_prefix }}.x | Storage traffic |
      | Tenant | {{ network_config.tenant_prefix }}.x | VM networking |
      | Storage Mgmt | {{ network_config.storagemgmt_prefix }}.x | Storage management |
      {% else %}
      **Network Isolation:** Disabled (Default networking)
      {% endif %}
      
      ### Environment Variables
      ```bash
      export NAMESPACE={{ openstack_namespace }}
      export OPERATOR_NAMESPACE={{ operator_namespace }}
      export NETWORK_ISOLATION={{ crc_network_isolation | string | lower }}
      export PASSWORD={{ crc_openstack_password }}
      export TIMEOUT={{ crc_openstack_timeout }}
      {% if crc_network_isolation %}
      export NETWORK_INTERNALAPI_ADDRESS_PREFIX={{ network_config.internalapi_prefix }}
      export NETWORK_STORAGE_ADDRESS_PREFIX={{ network_config.storage_prefix }}
      export NETWORK_TENANT_ADDRESS_PREFIX={{ network_config.tenant_prefix }}
      export NETWORK_STORAGEMGMT_ADDRESS_PREFIX={{ network_config.storagemgmt_prefix }}
      {% endif %}
      export STORAGE_CLASS=local-storage
      export OPENSTACK_RELEASE=antelope
      ```
      
      ## Make Commands Executed
      ```bash
      cd {{ install_yamls_path }}
      
      # Phase 1: Storage setup
      make crc_storage
      
      # Phase 2: Input secrets
      make input
      
      # Phase 3: Install operators
      make openstack
      
      # Phase 4: Initialize operators
      make openstack_init
      
      # Phase 5: Deploy control plane
      make openstack_deploy
      
      # Phase 6: Wait for completion (manual)
      make openstack_wait_deploy
      ```
      
      ## Access Information
      
      ### Monitoring Scripts
      - **Basic:** `./monitor-openstack-{{ current_server }}.sh`
      - **Advanced:** `./monitor-advanced-{{ current_server }}.sh`
      - **Configuration:** `./openstack-config-{{ current_server }}.md`
      
      ### OpenShift Commands
      ```bash
      # Check control plane
      oc get openstackcontrolplane -n {{ openstack_namespace }}
      
      # Monitor pods
      oc get pods -n {{ openstack_namespace }} -w
      
      # Check operators
      oc get subscription,csv -n {{ operator_namespace }}
      
      # View events
      oc get events -n {{ openstack_namespace }} --sort-by='.lastTimestamp'
      
      # Access OpenStack CLI (when ready)
      oc rsh -n {{ openstack_namespace }} openstackclient
      ```
      
      ### Service Access
      ```bash
      # Get service URLs
      oc get routes -n {{ openstack_namespace }}
      
      # Port forward Horizon (when available)
      oc port-forward -n {{ openstack_namespace }} service/horizon 8080:80
      
      # Port forward Keystone
      oc port-forward -n {{ openstack_namespace }} service/keystone-public 5000:5000
      ```
      
      ## Current Status
      {% if deployment_monitor is defined and deployment_monitor.stdout is defined %}
      ```
      {{ deployment_monitor.stdout }}
      ```
      {% else %}
      Status monitoring not yet available. Run `./monitor-advanced-{{ current_server }}.sh` for current status.
      {% endif %}
      
      ## Troubleshooting
      
      ### Common Issues
      1. **Operators not ready:** Wait 10-15 minutes, check `oc get csv -n {{ operator_namespace }}`
      2. **Pods not starting:** Check events with `oc get events -n {{ openstack_namespace }}`
      3. **Storage issues:** Verify `oc get storageclass local-storage`
      4. **Network issues:** Check NADs with `oc get network-attachment-definitions -n {{ openstack_namespace }}`
      
      ### Log Locations
      - **CRC logs:** `{{ crc_install_dir }}/crc.log`
      - **Pod logs:** `oc logs -n {{ openstack_namespace }} <pod-name>`
      - **Operator logs:** `oc logs -n {{ operator_namespace }} <operator-pod>`
      
      ## Next Steps
      1. **Wait for completion:** Run `make openstack_wait_deploy` in {{ install_yamls_path }}
      2. **Monitor progress:** Use monitoring scripts regularly
      3. **Test access:** Try OpenStack CLI when pods are ready
      4. **Configure SKMO:** Set up multi-region networking (if applicable)
      
      ---
      *Generated by enhanced CRC role with install_yamls integration*
    dest: "/home/{{ crc_user }}/advanced-deployment-{{ current_server }}.md"
    mode: '0644'
    owner: "{{ crc_user }}"
    group: "{{ crc_user }}"
  become: yes

# Phase 12: Final status summary
- name: Display advanced deployment summary
  debug:
    msg: |
      🎉 Advanced OpenStack Deployment Summary
      =======================================
      
      📍 **Server:** {{ current_server }} ({{ region_name }})
      📁 **Workload Namespace:** {{ openstack_namespace }}
      🔧 **Operator Namespace:** {{ operator_namespace }}
      🌐 **Network Isolation:** {{ 'Enabled' if crc_network_isolation else 'Disabled' }}
      
      📊 **Advanced Deployment Results:**
      - Storage: {{ '✅ SUCCESS' if storage_result.rc == 0 else '⚠️ WARNING' }}
      - Secrets: {{ '✅ SUCCESS' if secrets_result.rc == 0 else '❌ FAILED' }}
      - Operators: {{ '✅ SUCCESS' if operator_result.rc == 0 else '❌ FAILED' }}
      - Validation: {{ '✅ SUCCESS' if operator_validation.rc == 0 else '⏳ PENDING' }}
      - Initialization: {{ '✅ SUCCESS' if init_result.rc == 0 else '❌ FAILED' }}
      - Control Plane: {{ '✅ SUCCESS' if deploy_result.rc == 0 else '❌ FAILED' }}
      - Monitoring: {{ '✅ READY' if deployment_monitor.rc == 0 else '⏳ STARTING' }}
      
      {% if crc_network_isolation %}
      🔗 **Network Configuration:**
      - Internal API: {{ network_config.internalapi_prefix }}.x
      - Storage: {{ network_config.storage_prefix }}.x
      - Tenant: {{ network_config.tenant_prefix }}.x
      - Storage Mgmt: {{ network_config.storagemgmt_prefix }}.x
      {% endif %}
      
      📁 **Generated Management Files:**
      - Advanced Monitor: `/home/{{ crc_user }}/monitor-advanced-{{ current_server }}.sh`
      - Deployment Report: `/home/{{ crc_user }}/advanced-deployment-{{ current_server }}.md`
      - Basic Monitor: `/home/{{ crc_user }}/monitor-openstack-{{ current_server }}.sh`
      - Configuration: `/home/{{ crc_user }}/openstack-config-{{ current_server }}.md`
      
      🔧 **Next Steps:**
      1. Monitor: `ssh {{ crc_user }}@{{ ansible_host }} ./monitor-advanced-{{ current_server }}.sh`
      2. Wait: `cd {{ install_yamls_path }} && make openstack_wait_deploy`
      3. Access: OpenStack CLI when deployment completes
      {% if not is_region_zero %}
      4. Network: Configure SKMO for multi-region connectivity
      {% endif %}
      
      {{ '🔗 Multi-Region: Connect to Region Zero for identity services' if not is_region_zero else '👑 Region Zero: Provides identity services for all regions' }}