---
# Enhanced server-aware setup for afariasa deployment
# This task handles server-specific namespace provisioning

- name: Display server deployment information
  debug:
    msg: |
      Configuring namespace {{ ns_name }} on server {{ server_host | default('default') }}
      Region: {{ region | default('regionZero') }}
      Cluster Context: {{ ns_ctx | default('default') }}
  vars:
    ns_name: "{{ workload.name }}"
    ns_ctx: "{{ workload.cluster_context | default('') }}"
    server_host: "{{ workload.server_host | default('') }}"
    region: "{{ workload.region | default('regionZero') }}"

- name: Verify server connectivity and OpenShift access
  ansible.builtin.shell: |
    set -e
    # Test oc connectivity to the specific server context
    if [ -n "{{ ns_ctx }}" ]; then
      oc --context="{{ ns_ctx }}" get ns {{ ns_name }} >/dev/null 2>&1 || {
        echo "Warning: Cannot access namespace {{ ns_name }} on context {{ ns_ctx }}"
        echo "Please ensure:"
        echo "1. OpenShift cluster is accessible on {{ server_host | default('target server') }}"
        echo "2. Context {{ ns_ctx }} is configured in kubeconfig"
        echo "3. Namespace {{ ns_name }} exists"
        exit 1
      }
    else
      oc get ns {{ ns_name }} >/dev/null 2>&1 || {
        echo "Warning: Cannot access namespace {{ ns_name }} on default context"
        exit 1
      }
    fi
    echo "✓ Successfully connected to {{ ns_name }} on {{ server_host | default('default server') }}"
  args:
    executable: /bin/bash
  vars:
    ns_name: "{{ workload.name }}"
    ns_ctx: "{{ workload.cluster_context | default('') }}"
    server_host: "{{ workload.server_host | default('') }}"
  when: workload.name is defined
  ignore_errors: true
  register: connectivity_check

- name: Log connectivity results
  debug:
    msg: |
      Connectivity check for {{ workload.name }}:
      {% if connectivity_check.rc == 0 %}
      ✓ SUCCESS: {{ connectivity_check.stdout }}
      {% else %}
      ✗ FAILED: {{ connectivity_check.stdout | default('') }}{{ connectivity_check.stderr | default('') }}
      {% endif %}

- name: Create server-specific configuration directory
  file:
    path: "./server_configs/{{ server_host | default('default') }}"
    state: directory
    mode: '0755'
  vars:
    server_host: "{{ workload.server_host | default('') }}"
  delegate_to: localhost

- name: Generate server-specific deployment script
  template:
    src: server_deploy_script.sh.j2
    dest: "./server_configs/{{ server_host | default('default') }}/deploy_{{ ns_name }}.sh"
    mode: '0755'
  vars:
    ns_name: "{{ workload.name }}"
    ns_ctx: "{{ workload.cluster_context | default('') }}"
    server_host: "{{ workload.server_host | default('') }}"
    region: "{{ workload.region | default('regionZero') }}"
  delegate_to: localhost