---
- name: Fetch existing regions from regionZero
  vars:
    sk_ctx_zero: "{{ '--context ' ~ skmo_region_zero.cluster_context if (skmo_region_zero.cluster_context is defined and (skmo_region_zero.cluster_context | trim) != '') else '' }}"
  ansible.builtin.shell: |
    set -e
    oc {{ sk_ctx_zero }} -n {{ skmo_region_zero.name }} rsh openstackclient \
      openstack region list -f value -c Region
  args:
    executable: /bin/bash
  register: _region_list
  changed_when: false
  tags: [regions_endpoints]

- name: Ensure regions exist in regionZero for each workload
  vars:
    sk_ctx_zero: "{{ '--context ' ~ skmo_region_zero.cluster_context if (skmo_region_zero.cluster_context is defined and (skmo_region_zero.cluster_context | trim) != '') else '' }}"
  ansible.builtin.shell: |
    set -e
    oc {{ sk_ctx_zero }} -n {{ skmo_region_zero.name }} rsh openstackclient \
      openstack region create {{ workload.region }}
  args:
    executable: /bin/bash
  loop: "{{ skmo_workloads }}"
  loop_control:
    loop_var: workload
  when:
    - workload.region is defined
    - workload.region not in (_region_list.stdout_lines | default([]))
  tags: [regions_endpoints]

- name: Discover and mirror workload service endpoints into regionZero
  ansible.builtin.include_tasks: _regions_endpoints_per_ns.yml
  loop: "{{ skmo_workloads }}"
  loop_control:
    loop_var: workload
  when: workload.region is defined
  vars:
    ns_name: "{{ workload.name }}"
    ns_ctx: "{{ workload.cluster_context | default('') }}"
    oc_ctx: "{{ '--context ' ~ ns_ctx if (ns_ctx is defined and (ns_ctx | trim) != '') else '' }}"
    endpoint_region: "{{ workload.region }}"
  tags: [regions_endpoints] 