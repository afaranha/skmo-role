---
# Gather service users from each workload namespace by exec'ing the openstackclient pod,
# read their passwords from the osp-secret (key format: <Capitalized>Password),
# then create corresponding users in regionZero Keystone using name "<region>_<service>".

- name: Process workload namespace - gather users, passwords, and mirror in regionZero
  ansible.builtin.include_tasks: _service_users_per_ns.yml
  loop: "{{ skmo_workloads }}"
  loop_control:
    loop_var: workload
  vars:
    ns_name: "{{ workload.name }}"
    ns_ctx: "{{ workload.cluster_context | default('') }}"
    oc_ctx: "{{ '--context ' ~ ns_ctx if (ns_ctx is defined and (ns_ctx | trim) != '') else '' }}"
    region: "{{ workload.region | default('') }}"
  when: workload.region is defined
  tags: [service_users] 